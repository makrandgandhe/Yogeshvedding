<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yogesh weds Divya</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      position: relative;
    }

    .video-container {
      position: fixed;
      inset: 0;
      z-index: 1;
      background: #000;
    }

    #inviteVideo {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
    }

    .flower-container {
      position: fixed;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 30;
    }

    .flower {
      position: absolute;
      top: -60px;
      opacity: 0;
      animation: flowerFall linear forwards;
    }

    @keyframes flowerFall {
      0% {
        transform: translateY(-60px) rotate(0deg);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(540deg);
        opacity: 0;
      }
    }

    .envelope-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center,
          rgba(60,30,10,0.12),
          rgba(0,0,0,0.92));
      transition: opacity 1s ease, visibility 1s ease;
    }

    .envelope-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .envelope {
      position: relative;
      width: 84vw;
      max-width: 390px;
      aspect-ratio: 1.45 / 1;
      cursor: pointer;
      animation: envelopeFloat 3s ease-in-out infinite;
      transform-style: preserve-3d;
    }

    @keyframes envelopeFloat {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    .envelope-base {
      position: absolute;
      inset: 0;
      border-radius: 16px;
      background: linear-gradient(145deg, #e8d0ac, #c99c63);
      box-shadow:
        0 24px 55px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.3);
      overflow: hidden;
    }

    .envelope-base::before,
    .envelope-base::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 50%;
      height: 100%;
      background: rgba(0,0,0,0.06);
    }

    .envelope-base::before {
      left: 0;
      clip-path: polygon(0 100%, 100% 100%, 100% 0);
    }

    .envelope-base::after {
      right: 0;
      clip-path: polygon(0 0, 100% 100%, 0 100%);
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 44%;
      background: linear-gradient(145deg, #d7b17d, #b88449);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      z-index: 4;
      box-shadow: 0 8px 20px rgba(0,0,0,0.25);
      transition: transform 1.4s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .letter {
      position: absolute;
      left: 7%;
      top: 16%;
      width: 86%;
      height: 68%;
      background: linear-gradient(180deg, #fffdf8, #f7f1e7);
      border-radius: 10px;
      z-index: 3;
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      transition:
        transform 1.6s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 1s ease;
    }

    .title-overlay {
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(1.9rem, 5.5vw, 2.7rem);
      font-weight: 700;
      color: #7a3b00;
      text-align: center;
      white-space: nowrap;
      line-height: 1.1;
      letter-spacing: 0.5px;
      margin-bottom: 18px;

      text-shadow:
        0 1px 0 rgba(255,255,255,0.9),
        0 2px 8px rgba(0,0,0,0.12);

      transition:
        transform 1.4s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.9s ease;
    }

    .subtitle {
      color: #666;
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      text-align: center;

      transition:
        transform 1.2s ease,
        opacity 0.8s ease;
    }

    .tap-text {
      position: absolute;
      bottom: -42px;
      width: 100%;
      text-align: center;
      color: #f3e2c7;
      font-size: 0.95rem;
      letter-spacing: 2px;
      animation: pulse 1.8s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.45;
        transform: translateY(0);
      }

      50% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
    }

    .envelope.open .letter {
      transform: translateY(-150px);
      opacity: 0;
    }

    .envelope.open .title-overlay,
    .envelope.open .subtitle {
      transform: translateY(-40px);
      opacity: 0;
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video id="inviteVideo" playsinline preload="auto">
      <source src="https://www.dropbox.com/scl/fi/enqjwti2ju83w0fj0dl9u/prushotam-khatri.mp4?rlkey=s57b6y16c09opv5qd7c3vi78o&st=6245ux4z&raw=1" type="video/mp4">
    </video>
  </div>

  <div class="flower-container" id="flowerContainer"></div>

  <div class="envelope-overlay" id="overlay">
    <div class="envelope" id="envelope">
      <div class="envelope-base"></div>

      <div class="letter">
        <div class="title-overlay">Yogesh weds Divya</div>
        <div class="subtitle">Tap to open your invitation</div>
      </div>

      <div class="flap"></div>

      <div class="tap-text">TAP THE ENVELOPE</div>
    </div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    const overlay = document.getElementById('overlay');
    const video = document.getElementById('inviteVideo');
    const flowerContainer = document.getElementById('flowerContainer');

    function showerFlowers() {
      const flowers = ['🌸', '🌺', '🌹', '🌼'];

      for (let i = 0; i < 40; i++) {
        const flower = document.createElement('div');
        flower.className = 'flower';
        flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];

        flower.style.left = Math.random() * 100 + 'vw';
        flower.style.fontSize = (18 + Math.random() * 18) + 'px';
        flower.style.animationDuration = (3 + Math.random() * 2) + 's';
        flower.style.animationDelay = (Math.random() * 0.8) + 's';

        flowerContainer.appendChild(flower);

        setTimeout(() => {
          flower.remove();
        }, 6000);
      }
    }

    envelope.addEventListener('click', () => {
      envelope.classList.add('open');
      showerFlowers();

      setTimeout(async () => {
        overlay.classList.add('hidden');

        try {
          video.currentTime = 0;
          video.muted = false;
          await video.play();

          if (video.requestFullscreen) {
            await video.requestFullscreen();
          } else if (video.webkitEnterFullscreen) {
            video.webkitEnterFullscreen();
          }
        } catch (err) {
          console.log(err);
        }
      }, 1800);
    });
  </script>

</body>
</html>
