<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Wedding Invitation</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      position: relative;
    }

    .video-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 1;
    }

    iframe {
      width: 100vw;
      height: 100vh;
      border: none;
      background: #000;
    }

    .envelope-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(40,20,10,0.3), rgba(0,0,0,0.92));
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    .envelope-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .envelope {
      position: relative;
      width: 82vw;
      max-width: 380px;
      aspect-ratio: 1.4 / 1;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.8s ease;
      animation: envelopeFloat 3s ease-in-out infinite;
    }

    .envelope:hover {
      transform: scale(1.02);
    }

    .envelope-base {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #e9d4b1, #d8b98d);
      border-radius: 10px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.45);
      overflow: hidden;
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 44%;
      background: linear-gradient(145deg, #d2b084, #c39a67);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 1s ease;
      z-index: 3;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
      transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .letter {
      position: absolute;
      left: 8%;
      top: 12%;
      width: 84%;
      height: 76%;
      background: #fff9ef;
      border-radius: 8px;
      z-index: 4;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      text-align: center;
      transition: transform 1s ease, opacity 1s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.18);
    }

    .envelope.open .letter {
      transform: translateY(-150px) scale(1.04);
      opacity: 0;
      transition: transform 1.2s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.9s ease;
    }

    .title {
      font-size: clamp(2rem, 6vw, 2.8rem);
      color: #6e2d00;
      margin-bottom: 12px;
      margin-top: 22px;
      font-weight: 700;
      letter-spacing: 1px;
      line-height: 1.15;
      text-align: center;
      font-family: "Georgia", "Times New Roman", serif;
      text-shadow: 0 1px 0 rgba(255,255,255,0.7), 0 3px 10px rgba(0,0,0,0.12);
      width: 100%;
      z-index: 5;
    }

    .subtitle {
      font-size: 0.95rem;
      color: #444;
      line-height: 1.5;
    }

    .tap-text {
      position: absolute;
      bottom: -42px;
      width: 100%;
      text-align: center;
      color: #f3e2c7;
      font-size: 0.95rem;
      letter-spacing: 1px;
      animation: pulse 1.6s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.5; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    @keyframes envelopeFloat {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-8px);
      }
    }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="video-container">
    <iframe
      id="inviteFrame"
      data-src="https://drive.google.com/file/d/1b9uZmq_KSMqbzOw0mnniUptMUTDY1NuY/preview?autoplay=1"
      allow="autoplay; fullscreen"
      allowfullscreen>
    </iframe>
  </div>

  <div class="envelope-overlay" id="overlay">
    <div class="envelope" id="envelope">
      <div class="envelope-base"></div>
      <div class="flap"></div>
      <div class="letter">
        <div class="title">Yogesh weds Divya</div>
        <div class="subtitle">Tap to open your invitation</div>
      </div>
      <div class="tap-text">TAP THE ENVELOPE</div>
    </div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    const overlay = document.getElementById('overlay');
    const frame = document.getElementById('inviteFrame');

    envelope.addEventListener('click', () => {
      envelope.classList.add('open');

      setTimeout(() => {
        frame.src = frame.dataset.src;
        overlay.classList.add('hidden');
      }, 1200);
    });
  </script>
</body>
</html>
