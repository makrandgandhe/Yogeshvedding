<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yogesh weds Divya</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: Arial, sans-serif;
    }

    body {
      position: relative;
    }

    .video-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      z-index: 1;
    }

    #inviteVideo {
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      background: #000;
    }

    .envelope-overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at center,
          rgba(70,40,10,0.12),
          rgba(0,0,0,0.92));
      transition: opacity 0.9s ease, visibility 0.9s ease;
    }

    .envelope-overlay.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .envelope {
      position: relative;
      width: 82vw;
      max-width: 390px;
      aspect-ratio: 1.45 / 1;
      cursor: pointer;
      transform-style: preserve-3d;
      animation: float 3s ease-in-out infinite;
    }

    .envelope-base {
      position: absolute;
      inset: 0;
      background: linear-gradient(145deg, #e7cfac, #cfac79);
      border-radius: 14px;
      box-shadow:
        0 25px 50px rgba(0,0,0,0.5),
        inset 0 1px 0 rgba(255,255,255,0.35);
      overflow: hidden;
    }

    .envelope-base::before,
    .envelope-base::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 50%;
      height: 100%;
      background: rgba(0,0,0,0.06);
    }

    .envelope-base::before {
      left: 0;
      clip-path: polygon(0 100%, 100% 100%, 100% 0);
    }

    .envelope-base::after {
      right: 0;
      clip-path: polygon(0 0, 100% 100%, 0 100%);
    }

    .flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 44%;
      background: linear-gradient(145deg, #d3af7f, #b9854d);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      transform-origin: top center;
      transition: transform 1.25s cubic-bezier(0.22, 1, 0.36, 1);
      z-index: 4;
      box-shadow: 0 8px 18px rgba(0,0,0,0.25);
    }

    .letter {
      position: absolute;
      left: 7%;
      top: 18%;
      width: 86%;
      height: 64%;
      background: linear-gradient(180deg, #fffdf8, #f7f1e7);
      border-radius: 10px;
      z-index: 3;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 20px;
      text-align: center;
      box-shadow: 0 12px 30px rgba(0,0,0,0.18);
      transition:
        transform 1.2s cubic-bezier(0.22, 1, 0.36, 1),
        opacity 0.8s ease;
    }

    .title-overlay {
      position: absolute;
      top: 12%;
      left: 50%;
      transform: translateX(-50%);
      width: 90%;
      z-index: 20;
      text-align: center;

      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(2.2rem, 8vw, 3.2rem);
      font-weight: 700;
      line-height: 1.05;
      color: #6d2e00;

      text-shadow:
        0 1px 0 rgba(255,255,255,0.85),
        0 4px 14px rgba(0,0,0,0.2);
    }

    .subtitle {
      color: #555;
      font-size: 1rem;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .tap-text {
      position: absolute;
      bottom: -44px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #f3e2c7;
      font-size: 0.95rem;
      letter-spacing: 2px;
      animation: pulse 1.8s ease-in-out infinite;
    }

    .envelope.open .flap {
      transform: rotateX(180deg);
    }

    .envelope.open .letter {
      transform: translateY(-170px) scale(1.04);
      opacity: 0;
    }

    .envelope.open .title-overlay {
      opacity: 0;
      transform: translateX(-50%) translateY(-80px);
      transition:
        opacity 0.8s ease,
        transform 1s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-8px);
      }
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.45;
        transform: translateY(0);
      }
      50% {
        opacity: 1;
        transform: translateY(-4px);
      }
    }
  </style>
</head>
<body>

  <div class="video-container">
    <video
      id="inviteVideo"
      playsinline
      preload="auto"
    >
      <source
        src="https://www.dropbox.com/scl/fi/enqjwti2ju83w0fj0dl9u/prushotam-khatri.mp4?rlkey=s57b6y16c09opv5qd7c3vi78o&st=7pd80gi7&raw=1"
        type="video/mp4"
      />
    </video>
  </div>

  <div class="envelope-overlay" id="overlay">
    <div class="envelope" id="envelope">

      <div class="envelope-base"></div>

      <div class="title-overlay">
        Yogesh<br>weds Divya
      </div>

      <div class="flap"></div>

      <div class="letter">
        <div class="subtitle">Tap to open your invitation</div>
      </div>

      <div class="tap-text">TAP THE ENVELOPE</div>
    </div>
  </div>

  <script>
    const envelope = document.getElementById('envelope');
    const overlay = document.getElementById('overlay');
    const video = document.getElementById('inviteVideo');

    envelope.addEventListener('click', async () => {
      envelope.classList.add('open');

      setTimeout(async () => {
        overlay.classList.add('hidden');

        try {
          video.muted = false;
          await video.play();

          if (video.requestFullscreen) {
            await video.requestFullscreen();
          } else if (video.webkitEnterFullscreen) {
            video.webkitEnterFullscreen();
          }
        } catch (err) {
          console.log(err);
        }
      }, 1200);
    });
  </script>

</body>
</html>
